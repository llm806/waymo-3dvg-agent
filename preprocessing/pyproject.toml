[project]
name = "waymo-3dvg-preprocessing"
version = "0.1.0"
description = "Offline conversion through the official Waymo Perception v2 SDK"
requires-python = ">=3.10,<3.11"
dependencies = [
    "waymo-open-dataset-tf-2-12-0==1.6.7",
    "jaxlib==0.4.13",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# SDK requires this historical version, now hosted in JAX's official wheel archive.
jaxlib = { url = "https://storage.googleapis.com/jax-releases/nocuda/jaxlib-0.4.13-cp310-cp310-manylinux2014_x86_64.whl" }
